name: Android 1.1.5 - Financeiro Inteligente

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-android-1.1.5.yml"
      - "release/android/RELEASE-1.1.5.md"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: "6"
      ANDROID_VERSION_NAME: "1.1.5"
      VITE_API_BASE_URL: https://sindcopilot.com
      VITE_NATIVE_APP: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Carregar configuração pública de produção
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 3 https://sindcopilot.com/ -o /tmp/index.html
          python - <<'PY'
          import os, pathlib, re, urllib.parse, urllib.request
          root='https://sindcopilot.com/'
          html=pathlib.Path('/tmp/index.html').read_text(errors='ignore')
          data=html
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html):
              with urllib.request.urlopen(urllib.parse.urljoin(root, src), timeout=30) as response:
                  data += '\n' + response.read().decode('utf-8', errors='ignore')
          urls=sorted(set(re.findall(r'https://[a-z0-9-]+\.supabase\.co', data)))
          keys=[k for k in sorted(set(re.findall(r'eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+', data))) if len(k)>100]
          if not urls or not keys: raise SystemExit('Configuração pública do Supabase não encontrada')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write(f'VITE_SUPABASE_URL={urls[0]}\nVITE_SUPABASE_ANON_KEY={keys[0]}\n')
          PY

      - name: Validar aplicação
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Gerar Android 1.1.5
        run: |
          npm run mobile:assets
          npm run build:native
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
          node scripts/patch-capacitor-android.mjs

      - name: Compilar AAB release
        run: |
          cd android
          ./gradlew clean bundleRelease --stacktrace

      - name: Verificar AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          test -f "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -F 'com.sindcopilot.app'
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -F '1.1.5'
          mkdir -p release/android/build-1.1.5
          cp "$AAB" release/android/build-1.1.5/SindCopilot-1.1.5-play-unsigned.aab
          sha256sum release/android/build-1.1.5/* > release/android/build-1.1.5/SHA256SUMS-unsigned.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SindCopilot-1.1.5-unsigned
          path: release/android/build-1.1.5/
          retention-days: 7
          if-no-files-found: error
