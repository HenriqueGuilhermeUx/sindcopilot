name: Android AAB unsigned 1.1.6

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/android-aab-unsigned-1.1.6.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: https://sindcopilot.com
      VITE_NATIVE_APP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar dependências
        run: npm ci
      - name: Validar aplicação
        run: |
          npm run typecheck
          npm test
      - name: Compilar frontend nativo
        run: npm run build:native
      - name: Sincronizar Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-capacitor-android.mjs --version-code 7 --version-name 1.1.6 --unsigned
      - name: Compilar AAB sem assinatura
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Verificar artefato
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab SindCopilot-1.1.6-code7-unsigned.aab
          sha256sum SindCopilot-1.1.6-code7-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: SindCopilot-1.1.6-code7-unsigned-aab
          path: SindCopilot-1.1.6-code7-unsigned.aab
          retention-days: 7
          if-no-files-found: error
