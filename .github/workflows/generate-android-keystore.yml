name: Gerar Upload Key Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Gerar upload key do SindCopilot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validar secrets de senha e alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD ausente" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS ausente" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD ausente" && exit 1)

      - name: Gerar chave, certificado e Base64
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release/keystore
          keytool -genkeypair -v \
            -keystore release/keystore/sindcopilot-release.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -dname "CN=SindCopilot, OU=Mobile, O=SindCopilot, L=Santos, ST=SP, C=BR"
          base64 -w 0 release/keystore/sindcopilot-release.jks > release/keystore/ANDROID_KEYSTORE_BASE64.txt
          keytool -exportcert -rfc \
            -keystore release/keystore/sindcopilot-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file release/keystore/upload-certificate.pem
          keytool -list -v \
            -keystore release/keystore/sindcopilot-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA1:|SHA256:" > release/keystore/fingerprints.txt

      - name: Publicar pacote da chave por 7 dias
        uses: actions/upload-artifact@v4
        with:
          name: SindCopilot-upload-key-SALVAR-EM-LOCAL-SEGURO
          path: release/keystore/
          retention-days: 7
          if-no-files-found: error
