name: Android APK Teste

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode"
        required: true
        default: "1"
      version_name:
        description: "Versão exibida no aplicativo"
        required: true
        default: "1.1.0"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: sindcopilot-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar e verificar APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
      ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || '1.1.0' }}
      VITE_API_BASE_URL: https://sindcopilot.com
      VITE_NATIVE_APP: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar configuração do frontend
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "VITE_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
              echo "VITE_SUPABASE_ANON_KEY=ci-placeholder-public-anon-key" >> "$GITHUB_ENV"
            else
              echo "Secret VITE_SUPABASE_URL ausente"
              exit 1
            fi
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Secret VITE_SUPABASE_ANON_KEY ausente"
            exit 1
          fi

      - name: Instalar dependências
        run: npm install

      - name: Typecheck e testes
        run: |
          npm run typecheck
          npm test

      - name: Gerar identidade visual e materiais da loja
        run: npm run mobile:assets

      - name: Compilar frontend nativo
        run: npm run build:native

      - name: Criar e sincronizar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android

      - name: Aplicar versão e requisitos Android
        run: node scripts/patch-capacitor-android.mjs

      - name: Compilar APK instalável
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -f "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          mkdir -p release/android
          cp "$APK" "release/android/SindCopilot-${ANDROID_VERSION_NAME}-teste.apk"
          sha256sum "release/android/SindCopilot-${ANDROID_VERSION_NAME}-teste.apk" > release/android/SHA256SUMS.txt

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: SindCopilot-${{ env.ANDROID_VERSION_NAME }}-APK-teste
          path: release/android/
          retention-days: 30
          if-no-files-found: error
