name: Android 1.1.4 - AAB Google Play

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_VERSION_CODE: '5'
  ANDROID_VERSION_NAME: '1.1.4'
  VITE_API_BASE_URL: https://sindcopilot.com
  VITE_NATIVE_APP: 'true'

jobs:
  build-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Carregar configuração pública de produção
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 3 https://sindcopilot.com/ -o /tmp/index.html
          python - <<'PY'
          import os, pathlib, re, urllib.parse, urllib.request
          root='https://sindcopilot.com/'
          html=pathlib.Path('/tmp/index.html').read_text(errors='ignore')
          data=html
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html):
              with urllib.request.urlopen(urllib.parse.urljoin(root, src), timeout=30) as response:
                  data += '\n' + response.read().decode('utf-8', errors='ignore')
          urls=sorted(set(re.findall(r'https://[a-z0-9-]+\.supabase\.co', data)))
          keys=[k for k in sorted(set(re.findall(r'eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+', data))) if len(k)>100]
          if not urls or not keys:
              raise SystemExit('Configuração pública do Supabase não encontrada')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write(f'VITE_SUPABASE_URL={urls[0]}\nVITE_SUPABASE_ANON_KEY={keys[0]}\n')
          PY

      - name: Instalar e validar aplicação
        run: |
          npm install
          npm run typecheck
          npm test

      - name: Gerar Android de produção
        run: |
          npm run mobile:assets
          npm run build:native
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
          node scripts/patch-capacitor-android.mjs

      - name: Compilar AAB release
        working-directory: android
        run: ./gradlew clean bundleRelease --stacktrace

      - name: Verificar pacote e versão
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          test -f "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -F 'com.sindcopilot.app'
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -F '1.1.4'
          mkdir -p release/android
          cp "$AAB" release/android/SindCopilot-1.1.4-play-unsigned.aab
          sha256sum release/android/SindCopilot-1.1.4-play-unsigned.aab > release/android/SHA256SUMS-unsigned.txt

      - name: Publicar AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: SindCopilot-1.1.4-unsigned
          path: release/android/
          retention-days: 7
          if-no-files-found: error
