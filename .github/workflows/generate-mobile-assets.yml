name: Gerar Assets Android e Google Play

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-assets:
    name: Gerar ícones, splash e screenshots oficiais
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar arquivos PNG
        run: npm run mobile:assets

      - name: Validar dimensões e nomes
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const expected = {
            'play-store/generated/icon-512.png': [512, 512],
            'play-store/generated/feature-graphic-1024x500.png': [1024, 500],
            'play-store/generated/phone-01-hoje.png': [1080, 1920],
            'play-store/generated/phone-02-modo-visita.png': [1080, 1920],
            'play-store/generated/phone-03-ocorrencia.png': [1080, 1920],
            'play-store/generated/phone-04-compliance.png': [1080, 1920],
            'play-store/generated/phone-05-documentos-ia.png': [1080, 1920],
            'play-store/generated/phone-06-offline.png': [1080, 1920],
            'assets/icon-only.png': [1024, 1024],
            'assets/icon-foreground.png': [1024, 1024],
            'assets/icon-background.png': [1024, 1024],
            'assets/splash.png': [2732, 2732],
          };
          (async () => {
            for (const [file, dimensions] of Object.entries(expected)) {
              if (!fs.existsSync(file)) throw new Error(`Arquivo ausente: ${file}`);
              const meta = await sharp(file).metadata();
              if (meta.width !== dimensions[0] || meta.height !== dimensions[1]) {
                throw new Error(`${file}: ${meta.width}x${meta.height}; esperado ${dimensions.join('x')}`);
              }
            }
            console.log('Todos os assets foram validados.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Versionar assets no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ play-store/generated/ public/app-icon-512.png
          if git diff --cached --quiet; then
            echo "Assets já estão atualizados."
          else
            git commit -m "chore: atualizar assets Android e Google Play [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publicar pacote visual para conferência
        uses: actions/upload-artifact@v4
        with:
          name: SindCopilot-assets-Google-Play
          path: |
            play-store/generated/
            assets/
          retention-days: 30
          if-no-files-found: error
