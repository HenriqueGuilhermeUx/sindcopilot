name: SindCopilot Android 1.1.0 Assinado

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/secure-android-release-handoff.yml"
      - "release/handoff-public-cert.pem"

permissions:
  contents: read

jobs:
  signed-release:
    name: Gerar APK, AAB e upload key criptografada
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: "1"
      ANDROID_VERSION_NAME: "1.1.0"
      VITE_API_BASE_URL: https://sindcopilot.com
      VITE_NATIVE_APP: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Carregar configuração pública de produção
        run: node scripts/load-public-mobile-config.mjs

      - name: Instalar dependências e validar aplicação
        run: |
          npm install
          npm run typecheck
          npm test
          npm run mobile:assets
          npm run build:native

      - name: Criar e sincronizar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android

      - name: Gerar upload key exclusiva sem expor credenciais
        shell: bash
        run: |
          set +x
          STORE_PASS=$(openssl rand -hex 24)
          KEY_PASS=$(openssl rand -hex 24)
          KEY_ALIAS=sindcopilot
          keytool -genkeypair -v \
            -keystore android/app/sindcopilot-release.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=SindCopilot, OU=Mobile, O=SindCopilot, L=Santos, ST=SP, C=BR" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          mkdir -p release/private
          cat > release/private/credentials.env <<EOF
          ANDROID_KEYSTORE_PASSWORD=$STORE_PASS
          ANDROID_KEY_ALIAS=$KEY_ALIAS
          ANDROID_KEY_PASSWORD=$KEY_PASS
          PACKAGE_NAME=com.sindcopilot.app
          VERSION_NAME=1.1.0
          VERSION_CODE=1
          EOF
          cp android/app/sindcopilot-release.jks release/private/sindcopilot-release.jks

      - name: Aplicar API 36, versão e assinatura
        run: node scripts/patch-capacitor-android.mjs

      - name: Compilar APK e AAB de produção
        run: cd android && ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: Verificar assinatura e integridade
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          test -f "$APK"
          test -f "$AAB"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          unzip -t "$AAB" >/dev/null
          mkdir -p release/android
          cp "$APK" release/android/SindCopilot-1.1.0-release.apk
          cp "$AAB" release/android/SindCopilot-1.1.0-play.aab
          sha256sum release/android/*.apk release/android/*.aab > release/android/SHA256SUMS.txt
          keytool -exportcert -rfc \
            -keystore android/app/sindcopilot-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file release/android/upload-certificate.pem >/dev/null
          keytool -list -v \
            -keystore android/app/sindcopilot-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA1:|SHA256:" > release/android/UPLOAD_CERTIFICATE_FINGERPRINTS.txt

      - name: Criptografar upload key para handoff privado
        shell: bash
        run: |
          set -euo pipefail
          tar -C release/private -cf release/SindCopilot-upload-key-private.tar .
          openssl cms -encrypt -binary -aes256 \
            -in release/SindCopilot-upload-key-private.tar \
            -out release/android/SindCopilot-upload-key-encrypted.p7m \
            -outform DER \
            release/handoff-public-cert.pem
          cp release/handoff-public-cert.pem release/android/handoff-public-cert.pem
          shred -u release/SindCopilot-upload-key-private.tar
          shred -u release/private/credentials.env
          shred -u release/private/sindcopilot-release.jks
          shred -u android/app/sindcopilot-release.jks
          rmdir release/private

      - name: Publicar pacote assinado e chave cifrada
        uses: actions/upload-artifact@v4
        with:
          name: SindCopilot-1.1.0-Android-Play-assinado
          path: release/android/
          retention-days: 7
          if-no-files-found: error
