name: Compilar AAB final 1.1.1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/Register.tsx"
      - "supabase/migrations/0004_lgpd_policy_version_2.sql"
      - ".github/workflows/build-final-aab-1.1.1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_VERSION_CODE: "2"
      ANDROID_VERSION_NAME: "1.1.1"
      VITE_API_BASE_URL: https://sindcopilot.com
      VITE_NATIVE_APP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Carregar configuração pública de produção
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sindcopilot.com/ -o /tmp/index.html
          python - <<'PY'
          import os, pathlib, re, urllib.parse, urllib.request
          root='https://sindcopilot.com/'
          html=pathlib.Path('/tmp/index.html').read_text(errors='ignore')
          data=html
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html):
              with urllib.request.urlopen(urllib.parse.urljoin(root, src), timeout=30) as response:
                  data += '\n' + response.read().decode('utf-8', errors='ignore')
          urls=sorted(set(re.findall(r'https://[a-z0-9-]+\.supabase\.co', data)))
          keys=[k for k in sorted(set(re.findall(r'eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+', data))) if len(k)>100]
          if not urls or not keys: raise SystemExit('Configuração pública não encontrada')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write(f'VITE_SUPABASE_URL={urls[0]}\nVITE_SUPABASE_ANON_KEY={keys[0]}\n')
          PY

      - name: Validar e compilar
        run: |
          npm install
          npm run typecheck
          npm test
          npm run mobile:assets
          npm run build:native
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
          node scripts/patch-capacitor-android.mjs
          cd android && ./gradlew clean bundleRelease --stacktrace

      - name: Verificar e publicar
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          test -f "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -F 'com.sindcopilot.app'
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -F '1.1.1'
          mkdir -p release/android
          cp "$AAB" release/android/SindCopilot-1.1.1-final-unsigned.aab
          sha256sum release/android/* > release/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SindCopilot-1.1.1-final-unsigned
          path: release/android/
          retention-days: 7
          if-no-files-found: error
