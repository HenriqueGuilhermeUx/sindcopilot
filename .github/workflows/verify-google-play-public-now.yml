name: Verificação pública Google Play agora

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-google-play-public-now.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validar páginas, conteúdo e API publicados
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local url="$1"
            local expected="$2"
            local body
            body=$(curl -fsSL --retry 3 --retry-delay 2 "$url") || return 1
            printf '%s' "$body" | grep -F "$expected" >/dev/null
          }
          for attempt in $(seq 1 24); do
            echo "Tentativa $attempt/24"
            if check_page "https://sindcopilot.com/privacidade" "Política de Privacidade do SindCopilot" \
              && check_page "https://sindcopilot.com/exclusao-de-conta" "Exclusão de conta e dados" \
              && check_page "https://sindcopilot.com/termos" "Termos de Uso do SindCopilot" \
              && curl -fsSL "https://sindcopilot.com/api/health" | grep -F '"status":"ok"' >/dev/null; then
              echo "VERIFICADO: privacidade, exclusão, termos e API estão públicos."
              exit 0
            fi
            sleep 30
          done
          exit 1
